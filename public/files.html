<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MultiWorks · Files</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/workspace.css"><script src="/preferences.js" defer></script><script src="/files-viewer.js" defer></script></head><body>
<main class="file-page"><header><a href="/">← <span>返回聊天</span></a><h1>文件查看器</h1><select id="viewer-theme" aria-label="主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select><button class="secondary language-switch">English</button></header>
<form id="filter-form" class="file-filters"><label>文件名<input id="filter-name" type="search" maxlength="200"></label><label>项目群<select id="filter-room"><option value="">所有项目群</option></select></label><label>类型<input id="filter-ext" placeholder="扩展名，例如 pdf" maxlength="20"></label><label>上传起始日期<input id="filter-from" type="date"></label><label>上传截止日期<input id="filter-to" type="date"></label><label>最小大小（MB）<input id="filter-min" type="number" min="0" step="any"></label><label>最大大小（MB）<input id="filter-max" type="number" min="0" step="any"></label><div class="preferences-row"><button class="primary">应用筛选</button><button type="reset" class="secondary">重置</button></div></form>
<div id="viewer-stats" class="file-stats" role="status"></div><div class="table-scroll"><table class="file-table"><thead><tr><th>文件</th><th>类型</th><th>大小</th><th>项目</th><th>上传者</th><th>上传时间</th><th>操作</th></tr></thead><tbody id="viewer-rows"></tbody></table><p id="viewer-empty" class="page-empty" hidden>没有匹配的文件</p></div><button id="file-load" class="secondary" hidden>加载更多</button><p class="file-footer">最新上传优先</p></main><div id="toast" class="toast" hidden role="alert"></div>
</body></html>
